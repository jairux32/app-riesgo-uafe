name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit frontend
        run: npm audit --audit-level=high
      - name: Install and audit functions
        working-directory: functions
        run: |
          npm ci
          npm audit --audit-level=high
          node -e "require('./index.js'); console.log('Functions OK')"
  build_and_deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_RIESGO_UAFE }}
          channelId: live
          projectId: app-riesgo-uafe
